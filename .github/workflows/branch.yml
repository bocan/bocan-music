# Branch CI: the light gate that runs on every push to a non-main branch.
#
# Deliberately small. It answers two questions fast: "did I leak a secret?"
# and "does it still lint, format and compile?". The full suite (tests,
# coverage, CodeQL) runs on the pull request, not here. See ADR-033.
name: Branch

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "website/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"

permissions:
  contents: read

# Explicit bash gives `-o pipefail` to any pipe written in a step; the
# implicit default is `bash -e` only, which would let a piped failing build
# pass. The Makefile sets it for its own xcbeautify pipes as well.
defaults:
  run:
    shell: bash

env:
  # The runner has no signing certificate: build ad-hoc, no team, no entitlements.
  XCB_OVERRIDE: "CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS="
  # Output noise (#458): the build prints only tasks with warnings or errors.
  # The flag lives in the Makefile and is empty for local runs.
  XCBEAUTIFY_FLAGS: "--quiet"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history so every commit on the branch is scanned)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          # GITHUB_PATH only applies to later steps; call it by path here.
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the commits this branch adds on top of main
        run: |
          git fetch --no-tags origin main
          gitleaks git --no-banner --redact --verbose --log-opts="origin/main..HEAD" .

  build:
    name: Lint, format & build
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Brewfile dependencies
        run: |
          # FFmpeg and Chromaprint are not in the Brewfile: Homebrew's are GPL
          # builds. The project builds both from source below (ADR-096).
          brew update --quiet
          brew bundle

      # The key holds everything the two builds are made from. No restore-keys:
      # a build from another pin or another configure line must not be reused.
      - name: Cache the LGPL FFmpeg and Chromaprint builds
        uses: actions/cache@v6
        with:
          path: |
            build/ffmpeg-lgpl
            build/chromaprint
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-lgpl-${{ hashFiles('.ffmpeg-source', '.chromaprint-source', 'Scripts/build-ffmpeg-lgpl.sh', 'Scripts/build-fpcalc.sh') }}

      - name: Build FFmpeg from source under the LGPL
        run: make ffmpeg-lgpl

      - name: Pin SwiftLint to .swiftlint-version
        run: |
          version="$(cat .swiftlint-version)"
          echo "Pinning SwiftLint to ${version}"
          mkdir -p "$RUNNER_TEMP/swiftlint"
          curl -fsSL "https://github.com/realm/SwiftLint/releases/download/${version}/portable_swiftlint.zip" \
            -o "$RUNNER_TEMP/swiftlint.zip"
          unzip -o "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/swiftlint"
          # Prepend so this shadows the Homebrew-installed swiftlint for every later step.
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Pin SwiftFormat to .swiftformat-version
        run: |
          version="$(cat .swiftformat-version)"
          echo "Pinning SwiftFormat to ${version}"
          mkdir -p "$RUNNER_TEMP/swiftformat"
          curl -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${version}/swiftformat.zip" \
            -o "$RUNNER_TEMP/swiftformat.zip"
          unzip -o "$RUNNER_TEMP/swiftformat.zip" swiftformat -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      # TagLib only. FFmpeg is not found through pkg-config: the package
      # manifests name the LGPL build by path (ADR-096).
      - name: Set pkg-config path for TagLib
        run: |
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/taglib/lib/pkgconfig" >> "$GITHUB_ENV"

      # A branch build only needs to compile; template placeholders are enough,
      # so no repository secrets are exposed to this workflow.
      - name: Stub Secrets.xcconfig (xcodegen requires it)
        run: |
          if [[ ! -f Secrets.xcconfig ]]; then
            cp Secrets.xcconfig.template Secrets.xcconfig
          fi

      - name: Doctor (print tool versions)
        run: make doctor

      - name: Build fpcalc from source and bundle it into Resources/
        run: make bundle-fpcalc

      - name: Generate Xcode project
        run: make generate

      - name: Lint (SwiftLint + SwiftFormat)
        run: make lint && make format-check

      - name: Build (Debug)
        run: make build

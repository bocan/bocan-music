# PR CI: the full gate. Runs the whole test and coverage suite on every pull
# request into main. Branch pushes get the light Branch workflow instead, and
# pushes to main run nothing: with branch protection, every commit on main has
# already passed this. See ADR-033.
#
# No paths-ignore here on purpose: a required check that never starts blocks
# the PR forever. Instead the `changes` job decides whether code changed and
# the build job is skipped (which counts as passed) for docs-only PRs.
name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff against the base branch
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          echo "$changed"
          # Anything outside these paths is code (or build config) and needs the suite.
          if grep -qvE '^(.*\.md|docs/.*|website/.*|\.github/ISSUE_TEMPLATE/.*|\.github/PULL_REQUEST_TEMPLATE/.*|CHANGELOG\.md)$' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changed: running the full suite."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: skipping the full suite."
          fi

  build-and-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Brewfile dependencies
        run: brew bundle

      - name: Pin SwiftLint to .swiftlint-version
        run: |
          version="$(cat .swiftlint-version)"
          echo "Pinning SwiftLint to ${version}"
          mkdir -p "$RUNNER_TEMP/swiftlint"
          curl -fsSL "https://github.com/realm/SwiftLint/releases/download/${version}/portable_swiftlint.zip" \
            -o "$RUNNER_TEMP/swiftlint.zip"
          unzip -o "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/swiftlint"
          # Prepend so this shadows the Homebrew-installed swiftlint for every later step.
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Pin SwiftFormat to .swiftformat-version
        run: |
          version="$(cat .swiftformat-version)"
          echo "Pinning SwiftFormat to ${version}"
          mkdir -p "$RUNNER_TEMP/swiftformat"
          curl -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${version}/swiftformat.zip" \
            -o "$RUNNER_TEMP/swiftformat.zip"
          unzip -o "$RUNNER_TEMP/swiftformat.zip" swiftformat -d "$RUNNER_TEMP/swiftformat"
          # Prepend so this shadows the Homebrew-installed swiftformat for every later step.
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Set pkg-config path for FFmpeg and TagLib
        run: |
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/ffmpeg/lib/pkgconfig:/opt/homebrew/opt/taglib/lib/pkgconfig" >> $GITHUB_ENV

      - name: Stub Secrets.xcconfig (xcodegen requires it)
        env:
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
          BOCAN_LASTFM_API_KEY: ${{ secrets.BOCAN_LASTFM_API_KEY }}
          BOCAN_LASTFM_SHARED_SECRET: ${{ secrets.BOCAN_LASTFM_SHARED_SECRET }}
        run: |
          if [[ ! -f Secrets.xcconfig ]]; then
            cp Secrets.xcconfig.template Secrets.xcconfig
          fi
          # Inject CI-provided values when present (otherwise template defaults stay).
          if [[ -n "${ACOUSTID_API_KEY:-}" ]]; then
            /usr/bin/sed -i '' "s|^ACOUSTID_API_KEY.*|ACOUSTID_API_KEY = ${ACOUSTID_API_KEY}|" Secrets.xcconfig
          fi
          if [[ -n "${BOCAN_LASTFM_API_KEY:-}" ]]; then
            /usr/bin/sed -i '' "s|^BOCAN_LASTFM_API_KEY.*|BOCAN_LASTFM_API_KEY = ${BOCAN_LASTFM_API_KEY}|" Secrets.xcconfig
          fi
          if [[ -n "${BOCAN_LASTFM_SHARED_SECRET:-}" ]]; then
            /usr/bin/sed -i '' "s|^BOCAN_LASTFM_SHARED_SECRET.*|BOCAN_LASTFM_SHARED_SECRET = ${BOCAN_LASTFM_SHARED_SECRET}|" Secrets.xcconfig
          fi

      - name: Doctor (print tool versions)
        run: make doctor

      - name: Bundle fpcalc + FFmpeg dylibs into Resources/
        run: make bundle-fpcalc

      - name: Generate Xcode project
        run: make generate

      - name: Lint (SwiftLint + SwiftFormat)
        run: make lint && make format-check

      - name: Build & Test with coverage
        run: make test-coverage 2>&1 | xcbeautify

      - name: Test AudioEngine package
        run: make test-audio-engine

      - name: Test Persistence package
        run: make test-persistence

      - name: Test Metadata package
        run: make test-metadata

      - name: Test Library package
        run: make test-library

      - name: Test UI package
        run: make test-ui

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: TestResults-${{ github.run_id }}
          path: build/TestResults.xcresult
          retention-days: 7
